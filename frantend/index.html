<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Workelate_CLI — chat</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">W</span>
        <div>
          <strong>Workelate</strong><span class="brand-cli">CLI</span>
          <div class="brand-sub">agent chat · remote terminal</div>
        </div>
      </div>

      <button id="status" class="status" type="button" title="Click to re-check the backend">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">connecting…</span>
      </button>

      <button id="newChat" class="ghost" type="button">New chat</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="empty" class="empty">
        <div class="empty-icon" aria-hidden="true">⌘</div>
        <h1>Ask the agent to run something.</h1>
        <p>
          Your message goes to the backend agent, which executes it through the
          configured remote CLI (Modal) and reports the conclusion.
        </p>
        <div class="suggestions">
          <button class="chip" type="button" data-prompt="pwd && whoami && git --version">pwd &amp;&amp; whoami &amp;&amp; git --version</button>
          <button class="chip" type="button" data-prompt="node --version && npm --version">node --version &amp;&amp; npm --version</button>
          <button class="chip" type="button" data-prompt="pwd && ls -la">pwd &amp;&amp; ls -la</button>
          <button class="chip" type="button" data-prompt="curl -sS -o /dev/null -w 'github_api=%{http_code}\n' https://api.github.com">curl https://api.github.com</button>
        </div>
        <p class="tip" id="emptyTip">Connecting to the backend…</p>
      </section>
    </main>

    <footer class="composer-wrap">
      <form id="form" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Run a command or describe a task…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message"
        ></textarea>
        <button id="send" class="send" type="submit" disabled>
          <span class="send-label">Run</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
      <div class="composer-meta">
        <label class="steps-field" title="Maximum agent steps">
          steps
          <input id="maxSteps" type="number" min="1" max="25" value="8" />
        </label>
        <span class="meta-sep">·</span>
        <button id="apiBtn" class="linklike" type="button" title="Change the backend API URL">API</button>
        <span class="meta-sep">·</span>
        <span class="hint">Enter to send · Shift+Enter for a new line</span>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
