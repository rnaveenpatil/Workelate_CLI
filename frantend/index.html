<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Workelate_CLI</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Applied before first paint so the theme never flashes.
    (function () {
      try {
        var saved = localStorage.getItem("workelate.theme");
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved || (light ? "light" : "dark");
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <span class="wordmark" aria-label="Workelate_CLI">Workelate_CLI</span>
      <div class="actions">
        <button id="newChat" class="icon-btn" type="button" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="theme" class="icon-btn" type="button" title="Switch theme" aria-label="Switch theme">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" />
          </svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
        </button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="empty" class="empty">
        <span class="empty-mark" aria-hidden="true">&gt;_</span>
        <h1>Workelate_CLI</h1>
        <p>Describe a task and the agent will run it on a remote Linux sandbox.</p>
        <div class="empty-hint">
          <kbd>Enter</kbd> to send
          <span aria-hidden="true">·</span>
          <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line
        </div>
      </section>
    </main>

    <footer class="composer-wrap">
      <form id="form" class="composer">
        <textarea id="input" rows="1" placeholder="Describe a task or type a command" autocomplete="off"
          spellcheck="false" aria-label="Message"></textarea>
        <button id="send" class="send" type="submit" disabled title="Send" aria-label="Send">
          <span class="send-label" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 19V5M6 11l6-6 6 6" />
            </svg>
          </span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>

</html>
